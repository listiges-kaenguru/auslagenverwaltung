<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>VereinsAuslagen</title>
  <meta name="description" content="Vereinsauslagen erfassen, verwalten und einreichen – mit Benutzerkonten.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#16171a">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="app-icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="app-icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="app-icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Auslagen">

  <!-- Farbschema vor dem ersten Zeichnen setzen (verhindert Aufblitzen) -->
  <script src="js/design.js"></script>

  <!-- Schrift lokal (offline verfügbar) -->
  <link rel="preload" href="fonts/atkinson-next-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>

  <!-- Toast-Benachrichtigung -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- App-Kopfzeile -->
  <header class="app-header">
    <div class="app-header__inner">
      <div>
        <h1 class="app-titel">VereinsAuslagen</h1>
        <div class="app-untertitel" id="kopfzeileUntertitel">Ausgabenverwaltung</div>
      </div>
      <div class="kopf-knoepfe">
        <button type="button" class="kopf-btn kopf-btn--text" id="aktualisierenKnopf" data-aktion="aktualisieren"
          aria-label="Aktualisieren" title="Neuesten Stand vom Server holen" hidden>
          <svg class="kopf-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
          </svg>
          <span class="kopf-btn__text" aria-hidden="true">Aktualisieren</span>
        </button>
        <button type="button" class="kopf-btn design-btn" id="designUmschalter" data-aktion="design-wechseln"
          aria-label="Farbschema: System – tippen zum Wechseln" title="Farbschema: System">
          <!-- System -->
          <svg class="design-btn__icon design-btn__icon--system" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>
          </svg>
          <!-- Hell -->
          <svg class="design-btn__icon design-btn__icon--light" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
          </svg>
          <!-- Dunkel -->
          <svg class="design-btn__icon design-btn__icon--dark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Hinweis: neue Version verfügbar -->
  <div id="updateBanner" class="hinweis-banner hinweis-banner--update" hidden>
    <div class="hinweis-banner__text">
      <div class="hinweis-banner__titel">Neue Version verfügbar</div>
      <div class="hinweis-banner__unter">Jetzt aktualisieren – deine Daten bleiben erhalten.</div>
    </div>
    <button type="button" class="hinweis-banner__btn" data-aktion="update-installieren">Aktualisieren</button>
  </div>

  <!-- Hinweis: App installieren -->
  <div id="installBanner" class="hinweis-banner" hidden>
    <div class="hinweis-banner__text">
      <div class="hinweis-banner__titel">App installieren</div>
      <div class="hinweis-banner__unter" id="installText">Zum Homescreen hinzufügen &amp; offline nutzen</div>
    </div>
    <button type="button" class="hinweis-banner__btn" id="installBtn" data-aktion="installieren">Installieren</button>
    <button type="button" class="hinweis-banner__x" data-aktion="install-ausblenden" aria-label="Hinweis ausblenden">✕</button>
  </div>

  <!-- Hauptinhalt (Ansichten werden per JS gerendert) -->
  <main class="haupt-inhalt" id="hauptInhalt">
    <noscript>
      <div class="leer-zustand">
        <div class="leer-zustand__titel">JavaScript benötigt</div>
        <div class="leer-zustand__text">Bitte aktiviere JavaScript, um VereinsAuslagen zu nutzen.</div>
      </div>
    </noscript>
  </main>

  <!-- Untere Navigation -->
  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <button type="button" class="nav-btn" data-aktion="navigiere" data-view="neu">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>
      </svg>
      Neu
    </button>
    <button type="button" class="nav-btn" data-aktion="navigiere" data-view="uebersicht">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Übersicht
    </button>
    <button type="button" class="nav-btn" data-aktion="navigiere" data-view="export">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15V3M8 11l4 4 4-4M3 17v1a3 3 0 003 3h12a3 3 0 003-3v-1"/>
      </svg>
      Export
    </button>
    <button type="button" class="nav-btn" id="navKasse" data-aktion="navigiere" data-view="kasse" hidden>
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10.5h19M6.5 15h4"/>
      </svg>
      Kasse
    </button>
    <button type="button" class="nav-btn" data-aktion="navigiere" data-view="profil">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/>
      </svg>
      Profil
    </button>
  </nav>

  <!-- Detail-Modal (Bottom Sheet) -->
  <div class="modal-hintergrund" id="detailModal" aria-hidden="true">
    <div class="modal-blatt" role="dialog" aria-modal="true" aria-labelledby="modalTitel" tabindex="-1">
      <div id="modalInhalt"></div>
    </div>
  </div>

</body>
</html>
